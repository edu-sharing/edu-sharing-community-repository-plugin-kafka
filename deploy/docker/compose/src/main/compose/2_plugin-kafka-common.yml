version: '3.7'

services:

  kafka:
    image: "${docker.registry}/${docker.common}/${docker.edu_sharing.community.common.kafka.name}:${docker.edu_sharing.community.common.kafka.tag}"
    expose:
      - '9092'
      - '9093'
      - '9094'
    volumes:
      - kafka-data-volume:/bitnami
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_LISTENERS: "CLIENT://:9092,EXTERNAL://:9093, CONTROLLER://:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_ADVERTISED_LISTENERS: "CLIENT://kafka:9092,EXTERNAL://${KAFKA_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9093}"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "CLIENT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9094"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9093}:9093"

  mongo-database:
    environment:
      MONGODB_EXTRA_NOTIFICATION_DATABASE: "${NOTIFICATION_SERVICE_DATABASE_NAME:-notification}"
      MONGODB_EXTRA_NOTIFICATION_USERNAME: "${NOTIFICATION_SERVICE_DATABASE_USER:-notification}"
      MONGODB_EXTRA_NOTIFICATION_PASSWORD: "${NOTIFICATION_SERVICE_DATABASES_PASS:-notification}"

  notification-service:
    image: "${docker.repository}/${docker.prefix}-deploy-docker-build-notification-service:${docker.tag}"
    command:
      - -Xms${NOTIFICATION_SERVICE_JAVA_XMS:-512m}
      - -Xmx${NOTIFICATION_SERVICE_JAVA_XMX:-512m}
      - -Dcom.sun.management.jmxremote
      - -Dcom.sun.management.jmxremote.authenticate=false
      - -Dcom.sun.management.jmxremote.port=7199
      - -Dcom.sun.management.jmxremote.ssl=false
    volumes:
      - "./templates:/application/templates"
    environment:
      SERVER_PORT: "8080"
      KAFKA_TOPICS_NOTIFICATION: "notification"
      KAFKA_TOPICS_USERDATA: "userdata"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_MAIL_HOST: "${REPOSITORY_SERVICE_MAIL_SERVER_SMTP_HOST:-repository-mailcatcher}"
      SPRING_MAIL_PORT: "${REPOSITORY_SERVICE_MAIL_SERVER_SMTP_PORT:-1025}"
      SPRING_MAIL_USERNAME: "${REPOSITORY_SERVICE_MAIL_SERVER_SMTP_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${REPOSITORY_SERVICE_MAIL_SERVER_SMTP_PASSWORD:-}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${REPOSITORY_SERVICE_MAIL_SERVER_SMTP_AUTH:-true}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${REPOSITORY_SERVICE_MAIL_SERVER_SMTP_STARTTLS_ENABLE:-true}"
      SPRING_MAIL_SEND_ADDRESS: "${REPOSITORY_SERVICE_MAIL_FROM:-noreply@notification-service.org}"
      SPRING_MAIL_REPORT_ADDRESS: "${REPOSITORY_SERVICE_MAIL_REPORT_RECEIVER:-noreply@notification-service.org}"
      SPRING_DATA_MONGODB_URI: "mongodb://${NOTIFICATION_SERVICE_DATABASE_USER:-notification}:${NOTIFICATION_SERVICES_DATABASES_PASS:-notification}@mongo-database:27017/${NOTIFICATION_SERVICES_DATABASES_NAME:-notification}?authSource=${NOTIFICATION_SERVICES_DATABASES_NAME:-notification}"
    expose:
      - "8080"
    ports:
      - "${COMMON_BIND_HOST:-127.0.0.1}:${NOTIFICATION_SERVICE_HTTP_PORT:-9400}:8080"
    depends_on:
      - kafka
      - mongo-database

volumes:
  kafka-data-volume:
